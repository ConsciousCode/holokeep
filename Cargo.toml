[package]
name = "holokeep"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hk"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
libp2p = "0.56"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
bytes = "1.12.1"
multihash-codetable = "0.2.2"
nonempty = "0.12.0"
sha2 = "0.11.0"
leb128 = "0.2.7"
digest = "0.11.3"
multibase = "0.9.3"
murmur3 = "0.5.2"
sha3 = "0.12.0"
sha1 = "0.11.0"
hex-macro = "0.1.0"
num_enum = "0.7.6"
typed_floats = "1.0.7"
futures = "0.3.34"
blake2 = "0.10.6"
typenum = "1.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
paste = "1.0.15"

[lints]
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
