[package]
name = "holokeep"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hk"
path = "src/main.rs"

[features]
default = ["net", "fuse"]
# The private mesh: libp2p, and a daemon to run it
net = ["dep:libp2p", "dep:tokio", "dep:notify"]
# `hk mount`: the soup as a read-only filesystem
fuse = ["dep:fuser", "dep:libc"]
fuser = ["dep:fuser"]
libc = ["dep:libc"]

[dependencies]
libp2p = { version = "0.56", optional = true, features = ["tokio", "tcp", "noise", "yamux", "pnet", "macros", "identify", "ping", "mdns", "kad", "request-response", "cbor", "ed25519"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "macros", "time", "io-util", "sync", "signal"] }
notify = { version = "8", optional = true, default-features = false }
thiserror = "2.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
bytes = "1.12.1"
multihash-codetable = "0.2.2"
nonempty = "0.12.0"
sha2 = "0.11.0"
leb128 = "0.2.7"
digest = "0.11.3"
multibase = "0.9.3"
murmur3 = "0.5.2"
sha3 = "0.12.0"
sha1 = "0.11.0"
hex-macro = "0.1.0"
num_enum = "0.7.6"
typed_floats = "1.0.7"
futures = "0.3.34"
blake2 = "0.10.6"
typenum = "1.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
paste = "1.0.15"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
tempfile = "3.27.0"
getrandom = { version = "0.2", features = ["std"] }
ed25519-dalek = "2.2"
rustix = { version = "1", features = ["fs", "process", "net"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7"
zeroize = "1"
fuser = { version = "0.18", default-features = false, optional = true }
libc = { version = "0.2.191", optional = true }

[lints]
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
ipld-core = "0.4"
proptest = "1"
serde_ipld_dagcbor = "0.7"
serde_ipld_dagjson = "0.2"
serde_json = "1"
